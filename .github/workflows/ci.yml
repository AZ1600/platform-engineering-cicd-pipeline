name: Publish Docker image to ECR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ecr-publish
  cancel-in-progress: false

jobs:
  docker-build:
    name: Build, attest and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: platform-engineering-cicd

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::808101329332:role/GitHubActionsPlatformCicdEcrPublisher
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: 808101329332

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Generate CycloneDX SBOM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/workspace" \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image \
            --format cyclonedx \
            --output /workspace/sbom.cdx.json \
            --skip-version-check \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Validate SBOM
        run: |
          python3 -m json.tool sbom.cdx.json >/dev/null

          python3 - <<'PY'
          import json

          with open("sbom.cdx.json", encoding="utf-8") as handle:
              sbom = json.load(handle)

          if sbom.get("bomFormat") != "CycloneDX":
              raise SystemExit("Expected a CycloneDX SBOM")

          components = sbom.get("components", [])
          print(f"CycloneDX SBOM validated with {len(components)} components")
          PY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Push Docker image to Amazon ECR
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_NAME="$ECR_REGISTRY/$ECR_REPOSITORY"
          IMAGE_URI="$IMAGE_NAME:$IMAGE_TAG"

          docker push "$IMAGE_URI"

          IMAGE_DIGEST=""

          for attempt in 1 2 3 4 5; do
            IMAGE_DIGEST="$(
              aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids imageTag="$IMAGE_TAG" \
                --region "$AWS_REGION" \
                --query 'imageDetails[0].imageDigest' \
                --output text 2>/dev/null || true
            )"

            if printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              break
            fi

            echo "Image digest not available yet; retrying..."
            sleep 2
          done

          if ! printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Unable to resolve a valid SHA-256 digest from Amazon ECR" >&2
            exit 1
          fi

          echo "Published image digest: $IMAGE_DIGEST"

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.image_digest }}

      - name: Generate SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.image_digest }}
          sbom-path: sbom.cdx.json
