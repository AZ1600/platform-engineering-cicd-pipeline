name: Validate container

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Dockerfile
        run: |
          docker run --rm -i \
            hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            < Dockerfile

      - name: Build container image
        run: docker build --tag platform-cicd:test .

      - name: Scan container image for vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-version-check \
            platform-cicd:test

      - name: Verify container runs as non-root
        run: |
          test "$(docker run --rm platform-cicd:test id -u)" = "101"
          test "$(docker run --rm platform-cicd:test id -g)" = "101"

      - name: Start hardened test container
        run: |
          docker run \
            --detach \
            --name platform-cicd-test \
            --publish 8080:8080 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            platform-cicd:test

      - name: Verify application response
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            http://localhost:8080 |
          grep --fixed-strings "Platform Engineering CI/CD Pipeline"

      - name: Show container logs after failure
        if: failure()
        run: docker logs platform-cicd-test 2>/dev/null || true

      - name: Remove test container
        if: always()
        run: docker rm --force platform-cicd-test 2>/dev/null || true